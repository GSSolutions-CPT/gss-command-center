<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workflows · GSS Command Center</title>
  <meta name="description" content="Manage and trigger inter-agent workflows. Automate commercial leads, marketing campaigns, software features, and emergency dispatches at GSS.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <div id="sidebar-root"></div>
    <div class="main">
      <div id="topbar-root"></div>
      <main class="content">

        <div class="page-header">
          <h1 class="page-title">Inter-Agent Workflows</h1>
          <p class="page-subtitle">Coordinated multi-agent processes that power the GSS digital workforce.</p>
        </div>

        <!-- Top stats strip -->
        <div class="kpi-grid">
          <div class="kpi-card">
            <div class="kpi-icon blue"><i class="fa-solid fa-diagram-project"></i></div>
            <div class="kpi-label">Active Workflows</div>
            <div class="kpi-value">4</div>
            <div class="kpi-change up"><i class="fa-solid fa-arrow-up"></i> +1 this month</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-icon green"><i class="fa-solid fa-circle-check"></i></div>
            <div class="kpi-label">Completed (30d)</div>
            <div class="kpi-value">62</div>
            <div class="kpi-change up"><i class="fa-solid fa-arrow-up"></i> 83% success rate</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-icon amber"><i class="fa-solid fa-spinner"></i></div>
            <div class="kpi-label">In Progress</div>
            <div class="kpi-value">9</div>
            <div class="kpi-change up"><i class="fa-regular fa-clock"></i> Avg 4.2 hrs</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-icon red"><i class="fa-solid fa-circle-exclamation"></i></div>
            <div class="kpi-label">Failure Rate</div>
            <div class="kpi-value">6.4%</div>
            <div class="kpi-change down"><i class="fa-solid fa-arrow-down"></i> Below 10% target</div>
          </div>
        </div>

        <div id="workflow-cards"></div>

      </main>
      <div id="footer-root"></div>
    </div>
  </div>

  <script src="js/shared.js"></script>
  <script>
    renderLayout('workflows');

    const WORKFLOWS = [
      {
        id: 'A',
        title: 'Workflow A · New Commercial Lead',
        desc: 'From inbound enquiry to signed contract — every commercial lead flows through these 4 agents.',
        badge: 'High Volume',
        steps: [
          { agent:'callie', name:'Callie', action:'Receives & qualifies enquiry' },
          { agent:'closer', name:'Closer', action:'Drafts compliant proposal' },
          { agent:'nexus', name:'Nexus Prime', action:'Reviews & approves' },
          { agent:'pixel', name:'Pixel', action:'Creates pitch visuals' }
        ],
        details: [
          '<strong>Callie</strong> receives the inbound email, captures POPIA consent, and creates a lead record in GSS-OS CRM.',
          '<strong>Closer</strong> is auto-assigned the lead, drafts a sector-specific proposal with PSiRA/COIDA clauses, and tags it for review.',
          '<strong>Nexus Prime</strong> validates pricing against historical wins, checks scope, and approves for delivery.',
          '<strong>Pixel</strong> generates branded cover graphics, executive summary slides, and a follow-up reel for outreach.'
        ],
        avgTime: '2.3 days',
        successRate: 89
      },
      {
        id: 'B',
        title: 'Workflow B · Full Marketing Campaign',
        desc: 'Strategic, cross-functional campaign launch — typically 2–4 weeks from brief to performance review.',
        badge: 'Strategic',
        steps: [
          { agent:'nexus', name:'Nexus Prime', action:'Defines goals & KPIs' },
          { agent:'ranker', name:'Ranker', action:'Keyword + content plan' },
          { agent:'closer', name:'Closer', action:'Sales collateral' },
          { agent:'pixel', name:'Pixel', action:'Creative assets' },
          { agent:'callie', name:'Callie', action:'Inbound enquiry capture' }
        ],
        details: [
          '<strong>Nexus Prime</strong> sets the campaign objective, target sector, budget, and success KPIs.',
          '<strong>Ranker</strong> builds the keyword universe, drafts the content calendar, and prepares location landing pages.',
          '<strong>Closer</strong> produces matching sales decks, one-pagers, and pricing tables for downstream conversion.',
          '<strong>Pixel</strong> designs the full creative system: hero images, social posts, video reels, branded graphics.',
          '<strong>Callie</strong> staffs the inbox and call line to ensure no inbound enquiry is dropped during the campaign.'
        ],
        avgTime: '18 days',
        successRate: 76
      },
      {
        id: 'C',
        title: 'Workflow C · Software Feature Deployment',
        desc: 'Kyle\'s product idea → shipped to NEXUS VMS or GSS-OS production in a controlled, tested pipeline.',
        badge: 'Engineering',
        steps: [
          { agent:'nexus', name:'Kyle', action:'Briefs feature request' },
          { agent:'devon', name:'Devon', action:'Designs & implements' },
          { agent:'devon', name:'GitHub PR', action:'Reviewed & merged' },
          { agent:'nexus', name:'NEXUS deploy', action:'Production release' }
        ],
        details: [
          '<strong>Kyle</strong> describes the feature in plain language with success criteria.',
          '<strong>Devon</strong> breaks it into tickets, designs the schema, writes the React + Supabase code, and adds tests.',
          '<strong>GitHub PR</strong> is opened with full change summary, screenshots, and test coverage report.',
          '<strong>NEXUS deploy</strong> runs CI checks, migrates the DB, deploys to staging, then promotes to production.'
        ],
        avgTime: '3.5 days',
        successRate: 94
      },
      {
        id: 'D',
        title: 'Workflow D · Emergency Repair Request',
        desc: 'A faulty alarm, broken gate, or down CCTV system — dispatched to Kyle within minutes.',
        badge: 'Urgent',
        steps: [
          { agent:'callie', name:'Callie', action:'Detects emergency keyword' },
          { agent:'nexus', name:'Kyle', action:'Dispatched directly' },
          { agent:'callie', name:'Callie', action:'Schedules technician' },
          { agent:'callie', name:'Callie', action:'Follow-up + invoice' }
        ],
        details: [
          '<strong>Callie</strong> scans every incoming email & WhatsApp for emergency keywords ("alarm down", "gate stuck", "no power").',
          '<strong>Kyle</strong> is paged directly on 062 955 8559 with the full context summary.',
          '<strong>Callie</strong> coordinates the technician schedule, books materials from suppliers, and confirms ETA with the client.',
          '<strong>Callie</strong> follows up 24 hours post-repair with a satisfaction check, then triggers invoicing in GSS-OS.'
        ],
        avgTime: '4.2 hours',
        successRate: 97
      }
    ];

    const agentClassMap = { callie:'callie', ranker:'ranker', devon:'devon', closer:'closer', pixel:'pixel', nexus:'nexus' };
    const agentIconMap = {
      callie: 'fa-headset', ranker: 'fa-chart-line', devon: 'fa-code',
      closer: 'fa-file-signature', pixel: 'fa-palette', nexus: 'fa-brain'
    };

    document.getElementById('workflow-cards').innerHTML = WORKFLOWS.map(w => `
      <div class="workflow-card">
        <div class="workflow-header">
          <div>
            <div style="display:flex;align-items:center;gap:10px;">
              <div class="workflow-title">${w.title}</div>
              <span class="badge-pill badge-info">${w.badge}</span>
            </div>
            <div class="workflow-desc">${w.desc}</div>
          </div>
          <button class="btn btn-primary" onclick="showToast('✓ Workflow ${w.id} triggered — agents are coordinating')"><i class="fa-solid fa-play"></i> Trigger Workflow</button>
        </div>

        <div class="flow-diagram">
          ${w.steps.map((s, i) => `
            <div class="flow-step">
              <div class="agent-avatar ${agentClassMap[s.agent]}"><i class="fa-solid ${agentIconMap[s.agent]}"></i></div>
              <div class="step-name">${s.name}</div>
              <div class="step-action">${s.action}</div>
            </div>
            ${i < w.steps.length - 1 ? '<div class="flow-arrow"><i class="fa-solid fa-arrow-right-long"></i></div>' : ''}
          `).join('')}
        </div>

        <div class="grid-2" style="gap:18px;">
          <div class="workflow-steps">
            <div style="font-size:11px;text-transform:uppercase;color:var(--text-muted);font-weight:700;letter-spacing:0.6px;margin-bottom:8px;">Step-by-step</div>
            <ol>${w.details.map(d => `<li>${d}</li>`).join('')}</ol>
          </div>
          <div>
            <div style="font-size:11px;text-transform:uppercase;color:var(--text-muted);font-weight:700;letter-spacing:0.6px;margin-bottom:8px;">Performance</div>
            <div style="background:var(--bg);border-radius:10px;padding:14px;margin-bottom:10px;">
              <div style="font-size:11.5px;color:var(--text-muted);">Average completion time</div>
              <div style="font-size:20px;font-weight:700;color:var(--navy);margin-top:2px;">${w.avgTime}</div>
            </div>
            <div style="background:var(--bg);border-radius:10px;padding:14px;">
              <div style="font-size:11.5px;color:var(--text-muted);margin-bottom:6px;">Success rate</div>
              <div style="font-size:20px;font-weight:700;color:var(--navy);margin-bottom:8px;">${w.successRate}%</div>
              <div class="progress"><div class="progress-bar green" style="width:${w.successRate}%"></div></div>
            </div>
          </div>
        </div>
      </div>
    `).join('');
  </script>
</body>
</html>
