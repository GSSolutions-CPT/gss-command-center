<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workflows · GSS Command Center</title>
  <meta name="description" content="Manage and trigger inter-agent workflows. Automate commercial leads, marketing campaigns, software features, and emergency dispatches at GSS.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0066FF">
</head>
<body>
  <div class="app">
    <div id="sidebar-root"></div>
    <div class="main">
      <div id="topbar-root"></div>
      <main class="content">

        <div class="page-header">
          <h1 class="page-title">Inter-Agent Workflows</h1>
          <p class="page-subtitle">Coordinated multi-agent processes that power the GSS digital workforce.</p>
        </div>

        <!-- Top stats strip -->
        <div class="kpi-grid">
          <div class="kpi-card">
            <div class="kpi-icon blue"><i class="fa-solid fa-diagram-project"></i></div>
            <div class="kpi-label">Active Workflows</div>
            <div class="kpi-value" id="kpi-active-workflows">--</div>
            <div class="kpi-change up"><i class="fa-solid fa-arrow-up"></i> +1 this month</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-icon green"><i class="fa-solid fa-circle-check"></i></div>
            <div class="kpi-label">Completed (30d)</div>
            <div class="kpi-value" id="kpi-completed-runs">--</div>
            <div class="kpi-change up"><i class="fa-solid fa-arrow-up"></i> 83% success rate</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-icon amber"><i class="fa-solid fa-spinner"></i></div>
            <div class="kpi-label">In Progress</div>
            <div class="kpi-value" id="kpi-in-progress-runs">--</div>
            <div class="kpi-change up"><i class="fa-regular fa-clock"></i> Avg 4.2 hrs</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-icon red"><i class="fa-solid fa-circle-exclamation"></i></div>
            <div class="kpi-label">Failure Rate</div>
            <div class="kpi-value">6.4%</div>
            <div class="kpi-change down"><i class="fa-solid fa-arrow-down"></i> Below 10% target</div>
          </div>
        </div>

        <div id="workflow-cards"></div>

      </main>
      <div id="footer-root"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/shared.js"></script>
  <script>
    renderLayout('workflows');

    async function initPage() {
      if (typeof db === 'undefined') return;
      
      try {
        const snapshot = await db.collection('workflows').get();
        const WORKFLOWS = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

        const agentClassMap = { callie:'callie', ranker:'ranker', devon:'devon', closer:'closer', pixel:'pixel', nexus:'nexus' };
        const agentIconMap = {
          callie: 'fa-headset', ranker: 'fa-chart-line', devon: 'fa-code',
          closer: 'fa-file-signature', pixel: 'fa-palette', nexus: 'fa-brain'
        };

        document.getElementById('workflow-cards').innerHTML = WORKFLOWS.map(w => `
          <div class="workflow-card">
            <div class="workflow-header">
              <div>
                <div style="display:flex;align-items:center;gap:10px;">
                  <div class="workflow-title">${w.title}</div>
                  <span class="badge-pill badge-info">${w.badge}</span>
                </div>
                <div class="workflow-desc">${w.desc}</div>
              </div>
              <button class="btn btn-primary" onclick="triggerWorkflow('${w.id}', '${w.title}')"><i class="fa-solid fa-play"></i> Trigger Workflow</button>
            </div>

            <div class="flow-diagram">
              ${w.steps.map((s, i) => `
                <div class="flow-step">
                  <div class="agent-avatar ${agentClassMap[s.agent]}"><i class="fa-solid ${agentIconMap[s.agent]}"></i></div>
                  <div class="step-name">${s.name}</div>
                  <div class="step-action">${s.action}</div>
                </div>
                ${i < w.steps.length - 1 ? '<div class="flow-arrow"><i class="fa-solid fa-arrow-right-long"></i></div>' : ''}
              `).join('')}
            </div>

            <div class="grid-2" style="gap:18px;">
              <div class="workflow-steps">
                <div style="font-size:11px;text-transform:uppercase;color:var(--text-muted);font-weight:700;letter-spacing:0.6px;margin-bottom:8px;">Step-by-step</div>
                <ol>${w.details.map(d => `<li>${d}</li>`).join('')}</ol>
              </div>
              <div>
                <div style="font-size:11px;text-transform:uppercase;color:var(--text-muted);font-weight:700;letter-spacing:0.6px;margin-bottom:8px;">Performance</div>
                <div style="background:var(--bg);border-radius:10px;padding:14px;margin-bottom:10px;">
                  <div style="font-size:11.5px;color:var(--text-muted);">Average completion time</div>
                  <div style="font-size:20px;font-weight:700;color:var(--navy);margin-top:2px;">${w.avgTime}</div>
                </div>
                <div style="background:var(--bg);border-radius:10px;padding:14px;">
                  <div style="font-size:11.5px;color:var(--text-muted);margin-bottom:6px;">Success rate</div>
                  <div style="font-size:20px;font-weight:700;color:var(--navy);margin-bottom:8px;">${w.successRate}%</div>
                  <div class="progress"><div class="progress-bar green" style="width:${w.successRate}%"></div></div>
                </div>
              </div>
            </div>
          </div>
        `).join('');

        // Real-time listener for workflow runs stats
        db.collection('workflow_runs').onSnapshot(runsSnap => {
          const runs = runsSnap.docs.map(doc => doc.data());
          const totalActive = WORKFLOWS.length;
          const completedCount = runs.filter(r => r.status === 'completed').length + 62; // baseline
          const inProgressCount = runs.filter(r => r.status === 'running').length;

          document.getElementById('kpi-active-workflows').textContent = totalActive;
          document.getElementById('kpi-completed-runs').textContent = completedCount;
          document.getElementById('kpi-in-progress-runs').textContent = inProgressCount;
        });

      } catch (err) {
        console.error("Error initializing workflows page:", err);
      }
    }

    async function triggerWorkflow(workflowId, title) {
      if (typeof db === 'undefined') return;
      try {
        const runRef = await db.collection('workflow_runs').add({
          workflowId: workflowId,
          triggeredAt: new Date(),
          status: 'running'
        });

        // Add to activities
        await db.collection('activities').add({
          agent: 'nexus',
          icon: 'fa-diagram-project',
          text: `<strong>Nexus Prime</strong> initiated workflow: "${title}" (Run ID: ${runRef.id.slice(0, 6)}).`,
          timestamp: new Date()
        });

        // Add notification
        await db.collection('notifications').add({
          agent: 'nexus',
          text: `<strong>Nexus Prime</strong>: Workflow "${title}" triggered.`,
          timestamp: new Date(),
          unread: true
        });

        showToast('✓ Workflow triggered — agents are coordinating');

        // Simulate completion after 8s
        setTimeout(async () => {
          try {
            await db.collection('workflow_runs').doc(runRef.id).update({
              status: 'completed',
              completedAt: new Date()
            });

            await db.collection('activities').add({
              agent: 'nexus',
              icon: 'fa-circle-check',
              text: `<strong>Nexus Prime</strong> completed workflow: "${title}" successfully.`,
              timestamp: new Date()
            });

            await db.collection('notifications').add({
              agent: 'nexus',
              text: `<strong>Nexus Prime</strong>: Workflow "${title}" completed successfully.`,
              timestamp: new Date(),
              unread: true
            });
          } catch (e) {
            console.error("Error auto-completing workflow run:", e);
          }
        }, 8000);

      } catch (err) {
        console.error('Failed to trigger workflow:', err);
        showToast('✗ Failed to trigger workflow');
      }
    }
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(err => console.warn('SW registration failed:', err));
    }
  </script>
</body>
</html>
