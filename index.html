<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In · GSS Digital Workforce Command Center</title>
  <meta name="description" content="Access the GSS Digital Workforce Command Center. Owner portal for managing security service workflows, South African compliance, projects, and AI agents in Cape Town.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-brand">
        <div class="logo-mark">G</div>
        <div>
          <h1>GSS Command Center</h1>
          <p>Digital Workforce · Cape Town</p>
        </div>
      </div>

      <h2>Welcome back</h2>
      <p class="subtitle">Sign in to access your digital workforce.</p>

      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" type="email" id="email" placeholder="kyle@globalsecuritysolutions.co.za" value="kyle@globalsecuritysolutions.co.za" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" type="password" id="password" placeholder="••••••••••" required>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-size:12.5px;">
          <label style="display:flex;align-items:center;gap:6px;color:var(--text-muted);">
            <input type="checkbox" checked> Remember me
          </label>
          <a href="#" onclick="handleForgotPassword(event)" style="color:var(--electric);font-weight:600;">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="height:44px;font-size:14px;">
          <i class="fa-solid fa-arrow-right-to-bracket"></i>
          Sign in to Command Center
        </button>
      </form>

      <div class="login-footer">
        Global Security Solutions<br>
        Durbanville, Cape Town
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-init.js"></script>
  <script>
    // Handle auth redirection
    if (window.auth) {
      window.auth.onAuthStateChanged(user => {
        if (user) {
          window.location.href = 'dashboard.html';
        }
      });
    }

    async function handleForgotPassword(e) {
      e.preventDefault();
      if (!window.auth) {
        alert("Authentication system is not loaded yet.");
        return;
      }
      
      const emailInput = document.getElementById('email').value;
      const email = emailInput || prompt("Please enter your email address to receive a password reset link:", "kyle@globalsecuritysolutions.co.za");
      if (!email) return;

      const existingError = document.getElementById('login-error');
      if (existingError) existingError.remove();

      const existingSuccess = document.getElementById('login-success');
      if (existingSuccess) existingSuccess.remove();

      try {
        await window.auth.sendPasswordResetEmail(email);
        
        const successDiv = document.createElement('div');
        successDiv.id = 'login-success';
        successDiv.style.cssText = 'color: var(--success); font-size: 13px; font-weight: 500; margin-top: 14px; text-align: center;';
        successDiv.textContent = 'Password reset link sent! Check your inbox.';
        
        const form = document.querySelector('form');
        form.appendChild(successDiv);
      } catch (err) {
        console.error("Password reset failed:", err);
        const errDiv = document.createElement('div');
        errDiv.id = 'login-error';
        errDiv.style.cssText = 'color: var(--danger); font-size: 13px; font-weight: 500; margin-top: 14px; text-align: center;';
        errDiv.textContent = err.message || 'Failed to send password reset email.';
        
        const form = document.querySelector('form');
        form.appendChild(errDiv);
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      if (!window.auth) {
        alert("Authentication system is not loaded yet.");
        return;
      }
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.querySelector('button[type="submit"]');
      const originalText = btn.innerHTML;
      
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Signing in...';
      
      const existingError = document.getElementById('login-error');
      if (existingError) existingError.remove();

      try {
        await window.auth.signInWithEmailAndPassword(email, password);
      } catch (err) {
        console.error("Login failed:", err);
        btn.disabled = false;
        btn.innerHTML = originalText;
        
        const errDiv = document.createElement('div');
        errDiv.id = 'login-error';
        errDiv.style.cssText = 'color: var(--danger); font-size: 13px; font-weight: 500; margin-top: 14px; text-align: center;';
        errDiv.textContent = err.message || 'Invalid email or password.';
        
        const form = document.querySelector('form');
        form.appendChild(errDiv);
      }
    }
  </script>
</body>
</html>
